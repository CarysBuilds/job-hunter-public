name: friend-windows

permissions:
  contents: read

on:
  push:
    branches: [codex/friend-windows-template]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install chromium
      - run: npm run check
      - run: npm run package:windows
      - run: npm run scan:sensitive -- --include-build
      - name: Read package version
        id: package-version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build friend installer
        uses: Minionguyjpro/Inno-Setup-Action@7547f78e92afc13352b946775483c5392b7fda10
        env:
          JOB_HUNTER_VERSION: ${{ steps.package-version.outputs.version }}
          JOB_HUNTER_STAGE: ${{ github.workspace }}\staging\windows
          JOB_HUNTER_OUTPUT: ${{ github.workspace }}\artifacts\windows
        with:
          path: packaging/windows/JobHunter.iss
      - run: npm run smoke:windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JobHunter-Friend-Setup-x64
          path: artifacts/windows/JobHunter-Friend-Setup-x64.exe
          retention-days: 30
